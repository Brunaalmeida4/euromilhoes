<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Euromilhões</title>
  <meta name="theme-color" content="#00399" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-4">
  <div class="container">

    <h1 class="text-center text-primary mb-4">Euromilhões</h1>

    <button id="banner-instalacao" class="btn btn-primary mb-3 d-none" onclick="instalarApp()">
       Instalar App
    </button>

    <div class="row g-2 align-items-center mb-4">
      <div class="col-auto">
        <label for="qtd" class="col-form-label">Número de chaves:</label>
      </div>
      <div class="col-auto">
        <input type="number" id="qtd" value="1" min="1" max="20"
               class="form-control" style="width: 80px;" />
      </div>

      <div class="col-auto">
        <button class="btn btn-primary" onclick="gerarChaves()">Gerar</button>
      </div>
    </div>
    <div class="row g-3" id="grelha">
      <div class="col-12 text-center text-muted">
        Clica em "Gerar" para criar as tuas chaves 
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    function gerarAleatorios(quantidade, min, max) {
      var numeros = []; 
      while (numeros.length < quantidade) {
        var n = Math.floor(Math.random() * (max - min + 1)) + min;
        if (!numeros.includes(n)) {
          numeros.push(n); 
        }
      }
      return numeros.sort(function(a, b) { return a - b; });
    }

    function criarBola(valor, tipo) {
      var cor = tipo === "estrela" ? "bg-warning text-dark" : "bg-primary text-white";
      return '<span class="bola ' + ' me-1">' + valor + '</span>';
    }

    function gerarChaves() {
      var input = document.getElementById("qtd");
      var quantidade = parseInt(input.value);

      if (isNaN(quantidade) || quantidade < 1) quantidade = 1;
      if (quantidade > 20) quantidade = 20;
      input.value = quantidade; 

      var grelha = document.getElementById("grelha");
      grelha.innerHTML = "";
      for (var i = 1; i <= quantidade; i++) {
        var numeros = gerarAleatorios(5, 1, 50); 
        var estrelas = gerarAleatorios(2, 1, 12); 
        var bolasN = numeros.map(function(n) { return criarBola(n, "numero"); }).join("");
        var bolasE = estrelas.map(function(e) { return criarBola(e, "estrela"); }).join("");
        var col = document.createElement("div");
        col.className = "col-12 col-md-6 col-lg-4";
        col.innerHTML =
          '<div class="card shadow-sm h-100">' +
            '<div class="card-body">' +
              '<h5 class="card-title text-primary">Chave ' + i + '</h5>' +
              '<p class="mb-1">' +
                '<small class="text-muted">Números:</small><br>' +
                bolasN +
              '</p>' +
              '<p class="mb-0 mt-2">' +
                '<small class="text-muted">Estrelas:</small><br>' +
                bolasE +
              '</p>' +
            '</div>' +
          '</div>';
        grelha.appendChild(col);
      }
    }

    if ("serviceWorker" in navigator) { 
      window.addEventListener("load", function() {
        navigator.serviceWorker
          .register("./sw.js")
          .then(function(r)  { console.log("✅ Service Worker registado:", r.scope); })
          .catch(function(e) { console.log("❌ Erro no Service Worker:", e); });
      });
    }

    var eventoInstalacao = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault(); 
      eventoInstalacao = e; 
      document.getElementById("banner-instalacao").classList.remove("d-none");
    });

    function instalarApp() {
      if (!eventoInstalacao) return;
      eventoInstalacao.prompt(); 
      eventoInstalacao.userChoice.then(function(resultado) {
        if (resultado.outcome === "accepted") {
          document.getElementById("banner-instalacao").classList.add("d-none");
        }
        eventoInstalacao = null;
      });
    }
    window.addEventListener("appinstalled", function() {
      document.getElementById("banner-instalacao").classList.add("d-none");
    });
  </script>

</body>
</html>
